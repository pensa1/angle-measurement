[pytest]
# Pytest configuration with coverage reporting (use when modules are implemented)

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options with coverage
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=core
    --cov=detection
    --cov=ui
    --cov=utils
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80

# Markers for organizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests across modules
    geometry: Tests for geometry calculations
    detection: Tests for line detection
    ui: Tests for user interface
    slow: Tests that take more than 1 second
    fixture: Tests that require image fixtures

# Coverage options
[coverage:run]
source = core,detection,ui,utils
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
