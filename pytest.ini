[pytest]
# Pytest configuration for angle measurement project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short

# Markers for organizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests across modules
    geometry: Tests for geometry calculations
    detection: Tests for line detection
    ui: Tests for user interface
    slow: Tests that take more than 1 second
    fixture: Tests that require image fixtures

# Coverage options
[coverage:run]
source = core,detection,ui,utils
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
